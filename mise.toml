[tools]
# The toolchain pin is the tagged Zig 0.17.0 release. Pin tagged
# releases only: the Zig download mirror deletes old dev builds, so a
# dev pin stops being installable. This matches the floor in
# build.zig.zon's minimum_zig_version and quic-zig's own floor (quic
# v0.23.0+ refuses every 0.17.0-dev build). Bump both together after
# re-verifying (test + ReleaseSafe + conformance + mem-profile).
zig = "0.17.0"
just = "1.58.0"
# act runs the GitHub Actions workflows locally under Docker (see
# CONTRIBUTING.md "Running CI locally with act"). Not used by the build
# itself — a developer-experience tool like `just`.
act = "0.2.89"
# Go, pinned to the same version the interop workflows' setup-go steps
# install, for locally running the quic-go / webtransport-go peers and
# `just qpack-interop`.
go = "1.27.0"

[env]
# Keep dependency archives project-local. This prevents a malformed archive
# produced by another Zig checkout (or by `zig fetch` on a moving master)
# from poisoning this project's otherwise content-addressed package cache.
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"
