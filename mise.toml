[tools]
# Zig 0.17 is unreleased, so the toolchain pin is an exact dev build
# rather than a floating master — builds must be reproducible, and a
# floating toolchain let any upstream commit break local and CI
# together. The pinned build is the one verified green (test +
# ReleaseSafe + conformance + mem-profile) and matches the floor
# recorded in build.zig.zon's minimum_zig_version. Bump both together
# after re-verifying on a newer master.
zig = "0.17.0-dev.1978+c961124d9"
just = "1.58.0"
# act runs the GitHub Actions workflows locally under Docker (see
# CONTRIBUTING.md "Running CI locally with act"). Not used by the build
# itself — a developer-experience tool like `just`.
act = "0.2.89"

[env]
# Keep dependency archives project-local. This prevents a malformed archive
# produced by another Zig checkout (or by `zig fetch` on a moving master)
# from poisoning this project's otherwise content-addressed package cache.
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"
