name: wt-interop-self-test

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# In-tree WebTransport interop check: bring up the http3-zig
# WebTransport echo server on a real UDP socket (Ubuntu's loopback,
# unlike a sandboxed dev host, has no restrictions on inter-process
# UDP) and run the matrix runner against it. This catches regressions
# in the real-socket pump path that the in-process integration tests
# don't reach.
#
# The third-party WebTransport interop matrix (`wt-interop.yml`,
# advisory: runs per-push and on a weekly cron backstop) covers the
# cross-implementation story; this workflow stays as the per-push
# real-socket HARD GATE and uses only http3-zig binaries so it doesn't
# depend on any external server staying alive.
# Least privilege: every job here only reads the repo.
permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Install server + matrix runner + per-target client
        run: zig build install-wt-interop-matrix external-wt-server

      - name: Start the WT echo server in the background
        run: |
          set -euo pipefail
          ./zig-out/bin/http3-zig-external-wt-server \
            --listen 127.0.0.1:0 \
            --max-sessions 1 \
            --max-lifetime-ms 60000 \
            > "${{ runner.temp }}/wt-server.log" 2>&1 &
          echo "$!" > "${{ runner.temp }}/wt-server.pid"

      - name: Wait for the server's READY line
        run: |
          set -euo pipefail
          for _ in $(seq 1 200); do
            if grep -q "^READY " "${{ runner.temp }}/wt-server.log"; then
              break
            fi
            sleep 0.05
          done
          if ! grep -q "^READY " "${{ runner.temp }}/wt-server.log"; then
            echo "::error::Server never reported READY"
            cat "${{ runner.temp }}/wt-server.log"
            exit 2
          fi
          PORT=$(awk '/^READY / {print $2; exit}' "${{ runner.temp }}/wt-server.log")
          echo "WT_SERVER_PORT=$PORT" >> "$GITHUB_ENV"
          echo "server listening on 127.0.0.1:$PORT"

      - name: Run the matrix against the in-tree server
        env:
          WT_INTEROP_MATRIX_URLS: "https://127.0.0.1:${{ env.WT_SERVER_PORT }}/wt-self-test"
        # --require-all: an unset/empty URL list or any failed target
        # fails the gate (without it, both are a green run).
        run: zig build wt-interop-matrix -- --require-all

      - name: Tear down the server
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/wt-server.pid" ]; then
            PID=$(cat "${{ runner.temp }}/wt-server.pid")
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          fi

      # Second gating leg: the BROWSER-ERA negotiation path. A
      # draft-02-only client (the wire shape shipped Chrome and Firefox
      # speak) against a server advertising every era must resolve to
      # draft02 and complete the full echo flow — the same negotiation
      # the advisory browser legs exercise with a real Chrome.
      - name: Start the all-eras server (legacy leg)
        run: |
          set -euo pipefail
          zig build external-wt-client
          ./zig-out/bin/http3-zig-external-wt-server \
            --listen 127.0.0.1:0 \
            --cert tests/data/test_cert.pem \
            --key tests/data/test_key.pem \
            --max-sessions 1 \
            --max-lifetime-ms 60000 \
            --eras modern,draft07,draft02 \
            > "${{ runner.temp }}/wt-era-server.log" 2>&1 &
          echo "$!" > "${{ runner.temp }}/wt-era-server.pid"
          for _ in $(seq 1 200); do
            grep -q "^READY " "${{ runner.temp }}/wt-era-server.log" && break
            sleep 0.05
          done
          grep -q "^READY " "${{ runner.temp }}/wt-era-server.log" || {
            echo "::error::era server never reported READY"
            cat "${{ runner.temp }}/wt-era-server.log"
            exit 2
          }
          PORT=$(awk '/^READY / {print $2; exit}' "${{ runner.temp }}/wt-era-server.log")
          echo "WT_ERA_SERVER_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Run the draft-02 client against the all-eras server
        env:
          WT_INTEROP_URL: "https://127.0.0.1:${{ env.WT_ERA_SERVER_PORT }}/wt-era-self-test"
        run: |
          set -euo pipefail
          # 2>&1 is load-bearing: the harness binaries report through
          # std.debug.print (stderr) — a bare `| tee` captures only
          # stdout and the assertions below then grep an empty file.
          ./zig-out/bin/http3-zig-external-wt-client --era draft02 --max-time-ms 15000 2>&1 \
            | tee "${{ runner.temp }}/wt-era-client.log"
          grep -q "OBSERVED negotiated era=draft02" "${{ runner.temp }}/wt-era-client.log" || {
            echo "::error::client did not negotiate the draft-02 era"
            exit 1
          }
          # The server's view agrees (belt-and-suspenders; the log line
          # is written mid-run so it is reliably present here).
          grep -q "era=draft02" "${{ runner.temp }}/wt-era-server.log" || {
            echo "::error::server never logged a draft-02 acceptance"
            exit 1
          }

      - name: Tear down the era server
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/wt-era-server.pid" ]; then
            PID=$(cat "${{ runner.temp }}/wt-era-server.pid")
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          fi

      # Third gating leg: two clients at once against one server.
      # Firefox opens two QUIC connections to one origin; a server that
      # serves only one connection fails this (the single-Connection
      # server did, 2026-10-04).
      - name: Two concurrent connections against one server
        run: bash interop/external_wt/two_clients.sh

      - name: Server logs (for debugging)
        if: always()
        run: |
          cat "${{ runner.temp }}/wt-server.log" || true
          cat "${{ runner.temp }}/wt-era-server.log" || true
