name: fuzz-nightly

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch: {}

# Long-form companion to the per-push `fuzz.yml`.
#
#   * corpus-loop     — keeps the deterministic corpus replays hot for 30
#                       minutes by looping the codec + WebTransport corpus
#                       runners. Neither accepts a duration flag, so we wrap
#                       with `timeout 30m` and accept exit 124 (SIGTERM) as
#                       successful budget exhaustion; anything else is a real
#                       crash and fails the job.
#   * coverage-guided — the actual coverage-guided fuzzer over the codec
#                       decode surface (`zig build test --fuzz`), which
#                       explores NEW inputs with coverage feedback rather than
#                       replaying a fixed corpus. Linux only: the
#                       std.testing.fuzz runtime aborts on macOS (the platform
#                       gap quic-zig also documents). Runs ReleaseSafe, so it
#                       is safety-checked (panics, integer overflow, bounds
#                       checks fire) but NOT sanitizer-grade: use-after-free
#                       and similar memory bugs that only ASan/UBSan catch
#                       can pass through it. ASan over the BoringSSL C++
#                       boundary is boringssl-zig's concern (BoringSSL is
#                       fuzzed upstream).
# Least privilege: every job here only reads the repo.
permissions:
  contents: read

jobs:
  corpus-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Build the fuzz harnesses
        run: |
          zig build fuzz-codecs
          zig build fuzz-corpus
          zig build fuzz-wt-interleaved

      - name: Loop codec + WebTransport corpus replays for 30 minutes
        run: |
          if timeout 30m bash -euo pipefail -c '
            zig build run-fuzz-smoke
            while true; do
              zig build run-fuzz-corpus
              zig build run-fuzz-wt-interleaved
            done
          '; then
            echo "::error::nightly fuzz loop exited before its 30-minute deadline"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 124 ]; then
              exit "$rc"
            fi
          fi

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-nightly-corpus-crashes
          path: |
            zig-out/
            fuzz/corpus/
            **/*.crash
          if-no-files-found: ignore
          retention-days: 14

  coverage-guided:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      # `zig build test --fuzz` drives every std.testing.fuzz site (the codec
      # harness in tests/integration/codecs.zig) with coverage feedback. It
      # runs until interrupted, so time-box it; exit 124 (SIGTERM from
      # `timeout`) is successful budget exhaustion.
      #
      # Known Zig-master fuzz-runner breakage is retried and, if it
      # persists, downgraded to a warning instead of a red run: the runner
      # itself can die on corrupted coverage metadata — quic-zig's rc-fuzz
      # documents "corrupted coverage file ... pcs_len was zero", and since
      # 2026-07-07 nightly zig master also aborts with
      # "panic: start index 1 is larger than end index 0" a few minutes in
      # (same family as ziglang/zig#25352; no crash input is ever produced
      # — the uploaded artifact contains only the seed corpus). A real
      # fuzz-found crash does not match these signatures and still fails
      # the job.
      #
      # Compile the fuzz test binary up front so the timed window below
      # measures fuzzing, not compilation (also hands the full 30-minute
      # budget to the fuzzer itself).
      #
      # `-Duse-llvm=true`: Zig 0.17 builds x86_64 with its self-hosted
      # backend, which emits no sancov sections, so without it the
      # fuzzer collects zero coverage on this runner (see build.zig).
      - name: Pre-compile the ReleaseSafe fuzz test binary
        run: zig build test -Doptimize=ReleaseSafe -Duse-llvm=true --summary all

      # The advisory skip is gated on a survival floor: the runner must
      # have fuzzed productively for at least five minutes before dying
      # (the runner emits no execution counts we can parse, so elapsed
      # fuzzing time is the activity signal). A faster death — signature
      # match or not — fails the job instead of silently going green.
      - name: Coverage-guided fuzz for 30 minutes
        id: coverage_fuzz
        run: |
          fuzz_elapsed=0
          run_fuzz() {
            fuzz_started=$(date +%s)
            set +e
            # ReleaseSafe: keeps safety checks (panics/UB fire) while
            # regaining compiler optimization — Debug fuzzing ran at a
            # fraction of the executions/sec the 30-minute budget could
            # deliver.
            timeout 30m zig build test -Doptimize=ReleaseSafe -Duse-llvm=true --fuzz 2>&1 | tee fuzz-nightly.log
            status=${PIPESTATUS[0]}
            set -e
            fuzz_elapsed=$(( $(date +%s) - fuzz_started ))
            # Zig 0.17.0: `zig build test --fuzz` EXITS 0 WHEN A FUZZ SITE
            # FAILS, and stops the run there. Exit 0 hid a harness crash
            # every night from 2026-09-05 to 2026-10-04. So the log
            # decides first, and an unbounded run that stops on its own
            # before the budget is a failure, never a pass.
            if real_crash; then
              echo "::error::fuzzer found a crash after ${fuzz_elapsed}s (see 'input saved to' / 'panic:' in the log)"
              return 1
            fi
            if [ "$status" -eq 124 ]; then return 0; fi
            if [ "$status" -eq 0 ]; then
              echo "::error::fuzzer stopped with exit 0 after ${fuzz_elapsed}s, before the 30-minute budget"
              return 1
            fi
            return "$status"
          }
          known_runner_bug() {
            grep -Eq "corrupted coverage file .*pcs_len was zero|panic: start index [0-9]+ is larger than end index [0-9]+" fuzz-nightly.log
          }
          # A saved input, or any panic that is not the known runner bug.
          real_crash() {
            grep -q "input saved to" fuzz-nightly.log && return 0
            grep -E "panic: " fuzz-nightly.log \
              | grep -Evq "panic: start index [0-9]+ is larger than end index [0-9]+"
          }
          survived_floor() {
            [ "$fuzz_elapsed" -ge 300 ]
          }
          if run_fuzz; then exit 0; fi
          if ! real_crash && known_runner_bug; then
            echo "::warning::Zig fuzz-runner infrastructure failure; retrying once with a clean fuzz cache"
            rm -rf .zig-cache/v
            if run_fuzz; then exit 0; fi
            if ! real_crash && known_runner_bug && survived_floor; then
              echo "::warning::Known Zig-master fuzz-runner bug reproduced twice after ${fuzz_elapsed}s of productive fuzzing (survival floor met); treating as advisory skip, artifacts uploaded"
              echo "known_runner_bug=true" >> "$GITHUB_OUTPUT"
              {
                echo "## Coverage-guided fuzz: advisory skip"
                echo ""
                echo "The known Zig-master fuzz-runner bug reproduced twice, after"
                echo "${fuzz_elapsed}s of productive fuzzing (floor: 300s). No crash"
                echo "input was produced; artifacts are attached to this run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::fuzz runner died after only ${fuzz_elapsed}s (below the 300s survival floor) — not treating as the known runner bug"
          fi
          exit 1

      - name: Upload fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-nightly-coverage-guided-crashes
          path: |
            zig-out/
            fuzz/corpus/
            .zig-cache/v/
            fuzz-nightly.log
          if-no-files-found: ignore
          retention-days: 14
