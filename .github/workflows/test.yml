name: test

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# http3-zig tracks Zig master via mise (mise.toml), matching quic-zig — the
# transport dependency it builds against. CI uses jdx/mise-action to install
# the same toolchain as local development.
#
# build.zig.zon pins quic and boringssl as URL+hash tarball dependencies,
# so a standalone CI checkout fetches everything itself — no local path
# checkout needed. To bump quic-zig, edit build.zig.zon's `.url` + `.hash`
# by hand (`tools/fetch-package-hash.sh <new-tarball-url>` prints the hash
# without poisoning the normal build cache; do NOT use `zig fetch --save`).
# Least privilege: every job here only reads the repo.
permissions:
  contents: read

jobs:
  build-test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optimize: Debug
            target: native
            advisory: false
          - os: ubuntu-latest
            optimize: ReleaseSafe
            target: native
            advisory: false
          - os: ubuntu-24.04-arm
            optimize: Debug
            target: native
            advisory: false
          - os: ubuntu-24.04-arm
            optimize: ReleaseSafe
            target: native
            advisory: false
          - os: macos-15
            optimize: Debug
            target: native
            advisory: false
          - os: macos-15
            optimize: ReleaseSafe
            target: native
            advisory: false
          # Preview the next macOS generation without making it a release gate.
          - os: macos-26
            optimize: Debug
            target: native
            advisory: true
          # Windows: promoted 2026-10-04 after two consecutive green
          # runs that ran all 1317 tests (ea21922, 7c5f0ff). The first
          # run failed zig fmt on CRLF checkouts (.gitattributes fix).
          - os: windows-latest
            optimize: Debug
            target: native
            advisory: false
          # 32-bit wire-parsing leg: u64->usize narrow-cast panics and
          # varint length arithmetic only bite on 32-bit targets.
          # x86-linux-musl binaries execute natively on x86_64 runners.
          - os: ubuntu-latest
            optimize: Debug
            target: x86-linux-musl
            advisory: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    # bash everywhere (Git Bash on Windows): the steps call shell
    # scripts, and an explicit `bash` also turns on pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check boringssl-zig pin matches quic-zig
        run: tools/check-boringssl-pin.sh

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      # Tracked files only: the zig-pkg package store (restored below) holds
      # dependency sources that drift under new zig fmt and must not gate us.
      - name: zig fmt check
        run: git ls-files -z '*.zig' '*.zon' | xargs -0 zig fmt --check

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Print toolchain
        run: |
          zig version
          uname -a

      - name: zig build
        run: zig build -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.target }} --summary all

      - name: zig build check-api
        run: zig build check-api -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.target }} --summary all

      # The count check fails a green build that ran fewer tests than
      # tests/test-count-floor (a test file that stopped being imported,
      # a binary that stopped being built). The summary goes to stderr.
      - name: zig build test
        run: |
          set -o pipefail
          zig build test -Doptimize=${{ matrix.optimize }} -Dtarget=${{ matrix.target }} --summary all 2>&1 | tee test-summary.log
          tools/check-test-count.sh test-summary.log

      # `zig build test` already depends on run_conformance_tests —
      # the standalone conformance step doubled the RFC-suite runtime
      # across the matrix and was removed.

      - name: zig build run-examples
        if: matrix.os == 'ubuntu-latest' && matrix.optimize == 'Debug'
        run: zig build run-examples --summary all

      # Real-socket proof for the production server skeleton: udp_server
      # loop on a background thread, udp_client GET / against it over
      # loopback UDP, non-zero exit unless a 200 + expected body came back.
      - name: zig build run-udp-smoke
        if: matrix.os == 'ubuntu-latest' && matrix.optimize == 'Debug'
        run: zig build run-udp-smoke --summary all

      # Consume http3-zig from an out-of-tree project and prove the exported
      # quic/boringssl module instances type-unify with the public API
      # (tools/consumer-smoke/src/main.zig). Module identity is
      # platform-independent — one runner is enough.
      - name: Consumer package smoke (module identity)
        if: matrix.os == 'ubuntu-latest' && matrix.optimize == 'Debug'
        run: |
          cd tools/consumer-smoke
          zig build --summary all
          zig build run

  # Long-running-session memory regression gate. `zig build mem-profile` runs
  # the WebTransport long-lived-session profiler (always ReleaseSafe) and exits
  # non-zero if per-iteration retained-memory growth exceeds the gate in
  # bench/wt_memory.zig (see docs/memory-profile.md). Own job — the ReleaseSafe
  # boringssl build is heavy — on one runner rather than the full matrix.
  mem-profile:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: zig build mem-profile (memory regression gate)
        run: zig build mem-profile

  # Real-socket bench tier (docs/sprints/2026-10-W2.md): H3 connect/GET
  # over loopback UDP and a many-connection memory soak. Report-only
  # until the Linux baseline lands (task B3); the JSON is uploaded.
  bench-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: zig build bench-e2e
        run: zig build bench-e2e -- --json bench-e2e.json

      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-e2e-${{ github.run_id }}
          path: bench-e2e.json
          if-no-files-found: ignore
          retention-days: 30

