name: release

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

on:
  push:
    tags: ['v*.*.*']

# http3-zig tracks Zig master via mise (mise.toml), matching the test
# workflow. The release job validates that the tag matches .version
# in build.zig.zon, runs the full test suite, and cuts a GitHub
# release whose notes are this version's CHANGELOG section plus the
# package hash consumers pin.
permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout http3-zig
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise (zig master + project tools)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-global-cache
          key: zig-global-cache-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-global-cache-

      # GitHub's tarball/raw endpoints flake (504s, DNS) often enough to fail
      # real runs. Prefetch the full dependency tree with retries so a bad
      # window costs seconds, not a red CI run; the cache above makes even
      # that rare.
      - name: Prefetch Zig dependencies (retry on network flake)
        run: |
          for i in 1 2 3 4 5; do
            if zig build --fetch; then exit 0; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::dependency prefetch failed after 5 attempts"
          exit 1

      - name: Print toolchain
        run: |
          zig version
          uname -a

      - name: Validate tag matches build.zig.zon version
        run: |
          zon_version=$(grep -E '^\s*\.version\s*=' build.zig.zon | awk -F'"' '{print $2}')
          tag_version="${GITHUB_REF_NAME#v}"
          echo "build.zig.zon version: ${zon_version}"
          echo "tag version (stripped): ${tag_version}"
          if [ "${zon_version}" != "${tag_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match build.zig.zon .version=${zon_version}"
            exit 1
          fi

      - name: zig build test
        timeout-minutes: 30
        run: zig build test --summary all

      # `zig build test` does NOT compile the out-of-test binaries
      # (examples/interop/fuzz); a signature change in src/ can pass
      # the whole suite and still ship broken binaries (the 5ee87e1
      # regression). The release gate compiles them all.
      - name: zig build examples (out-of-test binaries gate)
        timeout-minutes: 20
        run: zig build examples --summary all

      # A Zig package ships as source: consumers pin the tag tarball by
      # its package hash, so that hash is what the release publishes.
      # (Through v0.5.0 the release attached a ReleaseSafe
      # libhttp3_zig.a. It held no http3-zig code: the library exports
      # no symbols, and Zig compiles only what something references.)
      - name: Compute the tag tarball's package hash
        id: pkg
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          hash=""
          for i in 1 2 3 4 5; do
            if hash=$(tools/fetch-package-hash.sh "$url"); then break; fi
            echo "fetch attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          if [ -z "$hash" ]; then
            echo "::error::could not compute the package hash of $url"
            exit 1
          fi
          echo "package hash: $hash"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Notes: this version's CHANGELOG section (not the whole file),
      # then the build.zig.zon entry to pin it.
      - name: Write the release notes
        env:
          PKG_URL: ${{ steps.pkg.outputs.url }}
          PKG_HASH: ${{ steps.pkg.outputs.hash }}
        run: tools/release-notes.sh "${GITHUB_REF_NAME#v}" "$PKG_URL" "$PKG_HASH" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
